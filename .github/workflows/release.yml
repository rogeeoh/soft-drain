name: Release

# Tags are created by release-please with GITHUB_TOKEN, which never triggers
# tag-push workflows. This workflow is therefore called from release-please.yml
# (workflow_call) and kept manually dispatchable for re-publishing a tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:latest

      - name: Push Helm chart
        run: |
          helm package charts/soft-drain \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ inputs.tag }}"
          helm push "soft-drain-${{ steps.version.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Attach install manifest to the release
        run: |
          make build-installer IMG="${{ env.IMAGE }}:${{ inputs.tag }}"
          gh release upload "${{ inputs.tag }}" dist/install.yaml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach plugin binaries to the release
        run: |
          mkdir -p dist/plugin
          cp hack/kubectl_complete-soft_drain LICENSE dist/plugin/
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -ldflags="-s -w -X main.version=${{ inputs.tag }}" \
                -o dist/plugin/kubectl-soft_drain ./cmd/kubectl-soft_drain
              tar czf "kubectl-soft_drain_${{ steps.version.outputs.version }}_${os}_${arch}.tar.gz" \
                -C dist/plugin kubectl-soft_drain kubectl_complete-soft_drain LICENSE
            done
          done
          gh release upload "${{ inputs.tag }}" kubectl-soft_drain_*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
