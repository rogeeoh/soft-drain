name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # .golangci.yml uses the logcheck module plugin, which the stock binary
      # cannot load. make lint builds a custom golangci-lint with the plugin.
      - name: Run linter
        run: make lint
